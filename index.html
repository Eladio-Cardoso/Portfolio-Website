<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal portfolio — brutalist minimal design." />
  <title>Portfolio</title>

  <!-- ===== Tailwind CSS (CDN) ===== -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ===== Font: JetBrains Mono (monospace) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- ===== Tailwind Config ===== -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"JetBrains Mono"', 'Courier New', 'Courier', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- ===== Inline Styles ===== -->
  <style>
    /* Page fade-in on load */
    .page-content {
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Minimal scrollbar to match the aesthetic */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
    }

    .nav-link {
      position: relative;
      transition: color 0.15s;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0;
      height: 1px;
      background: #fff;
      transition: width 0.2s;
    }

    .nav-link:hover::after,
    .nav-link.active-link::after {
      width: 100%;
    }

    /* ===== Projects Dropdown ===== */
    .projects-dropdown {
      position: relative;
    }

    .projects-dropdown-toggle {
      cursor: pointer;
      user-select: none;
    }

    .projects-dropdown-toggle .arrow {
      display: inline-block;
      margin-left: 4px;
      font-size: 0.6em;
      transition: transform 0.25s ease;
    }

    .projects-dropdown.open .arrow {
      transform: rotate(180deg);
    }

    .projects-dropdown-menu {
      position: absolute;
      top: calc(100% + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      min-width: 240px;
      background: #111;
      border: 1px solid #333;
      padding: 6px 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
      z-index: 100;
    }

    .projects-dropdown.open .projects-dropdown-menu {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .projects-dropdown-menu a {
      display: block;
      padding: 8px 16px;
      color: #aaa;
      text-decoration: none;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: color 0.15s, background 0.15s;
    }

    .projects-dropdown-menu a:hover {
      color: #fff;
      background: #1a1a1a;
    }
  </style>
</head>

<body class="bg-black text-white font-mono min-h-screen">

  <!-- =====================================================
       NAVIGATION — Fixed top bar (shared across all pages)
       ===================================================== -->
  <nav id="main-nav" class="fixed top-0 left-0 w-full z-50 bg-black border-b border-neutral-800">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-center
             sm:justify-end gap-x-8 gap-y-2 px-6 py-4 text-sm uppercase tracking-widest">
      <a href="index.html"
        class="nav-link active-link text-white no-underline text-sm uppercase tracking-widest font-mono">
        Home
      </a>
      <a href="bio.html"
        class="nav-link text-white no-underline text-sm uppercase tracking-widest font-mono">
        Bio
      </a>
      <div class="projects-dropdown" id="projects-dropdown">
        <span class="nav-link text-white no-underline text-sm uppercase tracking-widest font-mono projects-dropdown-toggle"
              id="projects-dropdown-toggle">
          Projects <span class="arrow">▼</span>
        </span>
        <div class="projects-dropdown-menu">
          <a href="projects.html#project-1">Undisclosed Fantasy Novel</a>
          <a href="projects.html#project-2">Sci-Fi Novel</a>
          <a href="projects.html#project-3">Project Charlie</a>
          <a href="projects.html#project-4">Project Delta</a>
          <a href="projects.html#project-5">Project Echo</a>
          <a href="projects.html#project-6">Project Foxtrot</a>
          <a href="projects.html#project-7">Project Golf</a>
          <a href="projects.html#project-8">Project Hotel</a>
          <a href="projects.html#project-9">Project India</a>
          <a href="projects.html#project-10">Project Juliet</a>
        </div>
      </div>
      <a href="contact.html"
        class="nav-link text-white no-underline text-sm uppercase tracking-widest font-mono">
        Contact
      </a>
    </div>
  </nav>

  <!-- =====================================================
       MAIN CONTENT — Home / Hero image
       ===================================================== -->
  <main class="pt-20 px-6 pb-16 max-w-4xl mx-auto">
    <div class="page-content flex items-center justify-center min-h-[70vh]">
      <!--
        ★ SWAP THIS IMAGE ★
        Replace the src below with your own hero image.
      -->
      <img src="https://placehold.co/800x600/111/fff?text=Tuxedo+Man+Clubbing+Seagull+with+Frozen+Fish"
        alt="Surreal Art" class="w-full max-w-2xl h-auto" />
    </div>
  </main>

  <!-- ===== Dropdown Toggle Script ===== -->
  <script>
    (function () {
      const dropdown = document.getElementById('projects-dropdown');
      const toggle = document.getElementById('projects-dropdown-toggle');

      toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });

      document.addEventListener('click', function (e) {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('open');
        }
      });
    })();
  </script>

</body>

</html>
